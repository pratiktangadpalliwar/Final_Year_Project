[project]
name = "fl-rebuild-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "moto[s3]==5.0.16",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py311"
# Plan 1 owns server/app/, client/app/, dashboard/, tests/.
# Exclude v1 legacy modules at server/*.py + client/*.py + helm + terraform until
# Plan 3 cleanup.
extend-exclude = [
    "dataset/*.csv",
    "server/*.py",
    "client/*.py",
    "helm/**",
    "terraform/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
# E501: line length handled by formatter
# E702: semicolon-joined statements are intentional in compact dataclass mutators
# N806: tensor variables (X, X_train, X_val) follow ML convention
ignore = ["E501", "E702", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: requires moto/minio",
    "e2e: requires docker-compose",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]
